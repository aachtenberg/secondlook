<!doctype html>
<html lang="en" data-theme="$theme">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<script>try{var t=localStorage.getItem('dbtriage.theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
$refresh_meta
$icon_link
<style>
$css
</style>
<style>
$custom_css
</style>
</head>
<body>
<header class="top">
  <div class="left">
    <button type="button" id="nav-toggle" class="navtoggle" aria-label="toggle navigation" aria-expanded="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="brand" href="/">$logo_html<span>$brand</span></a>
  </div>
  <div class="right">
    <form class="search" action="/search" method="get" role="search">
      <span class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
      <input type="search" name="q" placeholder="Search targets, SQL ids…" aria-label="Search" value="$q">
    </form>
    <button type="button" id="theme-toggle" class="theme" aria-label="Switch theme" title="Switch theme"><svg class="sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <a class="btn" href="/settings"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
  </div>
</header>
<div class="shell">
<nav class="side" aria-label="targets">
$sidenav
</nav>
<main>
$body
</main>
</div>
<aside id="panel" class="panel" hidden aria-label="report file">
  <div class="panel-head"><b id="panel-title"></b><span class="grow"></span>
    <a id="panel-raw" href="#" target="_blank" rel="noopener">open raw</a>
    <button type="button" id="panel-close" class="x" aria-label="close">×</button></div>
  <pre id="panel-body"></pre>
</aside>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<footer>$footer</footer>
<script>
(function () {
  var nav = document.getElementById('nav-toggle'), KEY = 'dbtriage.nav';
  function setNav(open) {
    document.body.classList.toggle('nav-collapsed', !open); nav.setAttribute('aria-expanded', open ? 'true' : 'false');
    try { localStorage.setItem(KEY, open ? 'open' : 'closed'); } catch (e) {}
  }
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved === 'closed') setNav(false);
  nav.addEventListener('click', function () { setNav(document.body.classList.contains('nav-collapsed')); });
  var root = document.documentElement, tbtn = document.getElementById('theme-toggle');
  function isDark() {
    var t = root.getAttribute('data-theme');
    return t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function label() { var l = isDark() ? 'Switch to light theme' : 'Switch to dark theme'; tbtn.setAttribute('aria-label', l); tbtn.title = l; }
  label();
  tbtn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next); label();
    try { localStorage.setItem('dbtriage.theme', next); } catch (e) {}
  });
  document.querySelectorAll('[data-dialog]').forEach(function (b) {
    b.addEventListener('click', function () { var d = document.getElementById(b.getAttribute('data-dialog')); if (d) d.showModal(); });
  });
  // ---- toasts and in-place form saves (forms marked data-ajax; without JS they post and reload as before)
  var toasts = document.getElementById('toasts');
  function toast(text, kind) {
    var t = document.createElement('div'); t.className = 'toast ' + (kind || 'good');
    var m = document.createElement('span'); m.className = 'tmsg'; m.textContent = text; t.appendChild(m);
    var x = document.createElement('button'); x.type = 'button'; x.setAttribute('aria-label', 'dismiss'); x.textContent = '×'; t.appendChild(x);
    function bye() { t.classList.add('out'); setTimeout(function () { t.remove(); }, 260); }
    x.addEventListener('click', bye); setTimeout(bye, kind === 'bad' ? 9000 : 4000);
    toasts.appendChild(t);
  }
  window.dbtriageToast = toast;
  try { var pending = sessionStorage.getItem('dbtriage.toast'); if (pending) { sessionStorage.removeItem('dbtriage.toast'); pending = JSON.parse(pending); toast(pending.text, pending.kind); } } catch (e) {}
  document.addEventListener('submit', function (e) {
    var form = e.target; if (!form.hasAttribute || !form.hasAttribute('data-ajax')) return;
    e.preventDefault();
    var btn = e.submitter, url = (btn && btn.getAttribute('formaction')) || form.getAttribute('action');
    var data = new URLSearchParams(new FormData(form, btn));
    form.setAttribute('aria-busy', 'true');
    fetch(url, { method: 'POST', credentials: 'same-origin', body: data, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } })
      .then(function (r) { return r.text().then(function (t) { return { ok: r.ok, status: r.status, html: t }; }); })
      .then(function (res) {
        var doc = new DOMParser().parseFromString(res.html, 'text/html');
        var n = doc.querySelector('main .notice:not(.degraded)'), kind = res.ok && !(n && n.classList.contains('bad')) ? 'good' : 'bad';
        var text = n ? n.textContent.trim() : (res.ok ? 'saved' : 'failed (' + res.status + ')');
        var mode = form.getAttribute('data-ajax');
        if (mode === 'reload' && kind === 'good') {
          try { sessionStorage.setItem('dbtriage.toast', JSON.stringify({ text: text, kind: kind })); } catch (e) {}
          location.reload(); return;
        }
        if (mode === 'refresh-card' && kind === 'good') {
          var cards = [].slice.call(document.querySelectorAll('main .card')), i = cards.indexOf(form.closest('.card'));
          var fresh = doc.querySelectorAll('main .card')[i];
          if (i >= 0 && fresh) cards[i].replaceWith(document.importNode(fresh, true));
        }
        toast(text, kind);
      })
      .catch(function (err) { toast('could not save: ' + err.message, 'bad'); })
      .then(function () { form.removeAttribute('aria-busy'); });
  });

  // ---- file drawer
  var panel = document.getElementById('panel'), body = document.getElementById('panel-body'),
      title = document.getElementById('panel-title'), raw = document.getElementById('panel-raw');
  function close() { panel.hidden = true; document.body.classList.remove('panel-open'); }
  function open(href, name) {
    title.textContent = name; raw.href = href; body.textContent = 'loading…';
    panel.hidden = false; document.body.classList.add('panel-open');
    fetch(href, { credentials: 'same-origin' }).then(function (r) {
      if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
      var json = (r.headers.get('content-type') || '').indexOf('json') >= 0;
      return r.text().then(function (t) { if (!json) return t; try { return JSON.stringify(JSON.parse(t), null, 2); } catch (e) { return t; } });
    }).then(function (t) { body.textContent = t; }).catch(function (e) { body.textContent = 'could not load: ' + e.message; });
  }
  document.getElementById('panel-close').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  // ---- discuss panel (snapshot page only)
  var box = document.getElementById('discuss'), DKEY = 'dbtriage.discuss';
  var log, form, q, send, focus, intro, key = 'review', ready;
  if (box) {
    log = document.getElementById('chat-log'); form = document.getElementById('chat-form'); q = document.getElementById('chat-q');
    send = document.getElementById('chat-send'); focus = document.getElementById('discuss-focus'); intro = document.getElementById('discuss-intro');
    ready = box.getAttribute('data-ready') === '1';
  }
  function keyLabel(k) {
    if (k === 'review') return 'whole review';
    if (k.indexOf('finding-') === 0) return 'finding ' + k.slice(8);
    var id = k.slice(4); return 'sql ' + (id.length > 16 ? id.slice(0, 8) + '…' + id.slice(-4) : id);
  }
  function msg(role, html, footer) {
    var d = document.createElement('div'); d.className = 'dmsg ' + role;
    if (role === 'user') { d.textContent = html; }
    else {
      var a = document.createElement('span'); a.className = 'avatar'; a.textContent = 'AI'; d.appendChild(a);
      var t = document.createElement('div'); t.className = 'dtext'; t.innerHTML = html; d.appendChild(t);
      if (footer) { var f = document.createElement('div'); f.className = 'foot'; f.textContent = footer; t.appendChild(f); }
    }
    log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
  }
  function showBox(on) {
    box.hidden = !on; try { localStorage.setItem(DKEY, on ? 'open' : 'closed'); } catch (e) {}
  }
  function openKey(k, then) {
    key = k; focus.textContent = keyLabel(k); showBox(true); log.innerHTML = '';
    fetch(box.getAttribute('data-base') + k, { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (t) {
      var ms = t.messages || [];
      if (!ms.length) { log.appendChild(intro.content.cloneNode(true)); }
      ms.forEach(function (m) { msg(m.role, m.role === 'user' ? m.text : m.html, m.footer); });
      log.scrollTop = log.scrollHeight;
      if (then) then(); else q.focus();
    }).catch(function (e) { log.appendChild(intro.content.cloneNode(true)); msg('assistant', '<p class=err></p>').querySelector('.err').textContent = 'could not load earlier messages: ' + e.message; if (then) then(); });
  }
  if (box) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var text = q.value.trim(); if (!text || !ready) return;
      var s = log.querySelector('.sugg'); if (s) s.remove();
      msg('user', text); q.value = ''; send.disabled = true;
      var wait = msg('assistant', '<p class=mut>thinking…</p>');
      fetch(box.getAttribute('data-base') + key, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
                       body: JSON.stringify({ question: text }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (x) { wait.remove(); if (x.ok) { msg('assistant', x.j.html, x.j.footer); } else { msg('assistant', '<p class=err></p>').querySelector('.err').textContent = x.j.error || 'failed'; } })
        .catch(function (err) { wait.remove(); msg('assistant', '<p class=err></p>').querySelector('.err').textContent = err.message; })
        .then(function () { send.disabled = !ready; q.focus(); });
    });
    q.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
    document.getElementById('discuss-close').addEventListener('click', function () { showBox(false); });
    document.getElementById('discuss-open').addEventListener('click', function () { if (box.hidden) openKey(key); else q.focus(); });
    log.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-ask]'); if (!b) return;
      var text = b.getAttribute('data-ask'), k = b.getAttribute('data-key') || key;
      var put = function () { q.value = text; q.focus(); };
      if (k !== key) openKey(k, put); else put();
    });
    var closed = null; try { closed = localStorage.getItem(DKEY) === 'closed'; } catch (e) {}
    var deep = /^#chat-(review|finding-\d+|sql-[A-Za-z0-9_]+)$/.exec(location.hash);
    var askq = null; try { askq = new URLSearchParams(location.search).get('ask'); } catch (e) {}
    if (askq) { openKey('review', function () { q.value = askq; q.focus(); }); }  // the database page's Ask button: the diagnosis as the first question
    else if (deep) openKey(deep[1]); else if (closed) box.hidden = true; else openKey('review', function () {});
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-panel]');
    if (a) { e.preventDefault(); open(a.getAttribute('href'), a.textContent); return; }
    var c = e.target.closest('a[data-chat]');
    if (c && box) { e.preventDefault(); openKey(c.getAttribute('data-chat')); }
  });
})();
(function () {
  // table.sortable: each named header becomes a button. Numbers sort largest first and text A to Z; a second click
  // reverses. A cell's data-v, when present, is the value it sorts by (the cell may show 54% or 31.3k). Empty
  // values stay last either way.
  document.querySelectorAll('table.sortable').forEach(function (tbl) {
    var head = tbl.tHead && tbl.tHead.rows[0], body = tbl.tBodies[0];
    if (!head || !body) return;
    [].forEach.call(head.cells, function (th, i) {
      var label = th.textContent.trim();
      if (!label) return;
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'sortbtn'; b.textContent = label;
      th.textContent = ''; th.appendChild(b);
      b.addEventListener('click', function () {
        var key = function (r) { var c = r.cells[i]; return !c ? '' : c.hasAttribute('data-v') ? c.getAttribute('data-v') : c.textContent.trim(); };
        var blank = function (v) { return v === '' || v === '-'; };
        var rows = [].slice.call(body.rows).map(function (r, n) { return {r: r, v: key(r), n: n}; });
        var num = rows.every(function (x) { return blank(x.v) || isFinite(Number(x.v)); });
        var cur = th.getAttribute('aria-sort');
        var dir = cur === 'descending' ? 1 : cur === 'ascending' ? -1 : (num ? -1 : 1);
        rows.sort(function (a, z) {
          if (blank(a.v) || blank(z.v)) return blank(a.v) === blank(z.v) ? a.n - z.n : (blank(a.v) ? 1 : -1);
          var d = num ? Number(a.v) - Number(z.v) : a.v.localeCompare(z.v, undefined, {numeric: true, sensitivity: 'base'});
          return d * dir || a.n - z.n;
        }).forEach(function (x) { body.appendChild(x.r); });
        [].forEach.call(head.cells, function (h) { h.removeAttribute('aria-sort'); });
        th.setAttribute('aria-sort', dir === 1 ? 'ascending' : 'descending');
      });
    });
  });
})();
</script>
</body>
</html>
