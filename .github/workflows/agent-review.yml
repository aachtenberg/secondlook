# Copy to .github/workflows/agent-review.yml in a repo to get agentic PR
# reviews from aachtenberg/agent-review. Pick the `with:` block that matches
# the repo's visibility and delete the other.
name: Agent Review
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  review:
    # Same-repo PRs only, and /review only from the repo owner or an org
    # member (in an org-owned repo the owner's comments carry MEMBER).
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
        && startsWith(github.event.comment.body, '/review'))
    uses: aachtenberg/agent-review/.github/workflows/review.yml@v1
    # Public repo: a GitHub-hosted runner, never a self-hosted one (PR content must not reach a machine on our
    # network). The model is the shared default (GLM 5.3 Flash) via OpenRouter; there is no local fallback.
    with:
      runner: ubuntu-latest
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
