# gitleaks over the whole history on every PR and every push to main. It runs on a GitHub-hosted runner with a
# read-only token and no secrets, so a PR from a fork can run it safely. .gitleaks.toml lists the made-up lab
# credentials (docker-compose.yml, the .env.example files, the tests) that are meant to be public.
name: Secrets scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every commit, not just the tip
      - name: gitleaks (full history, findings redacted)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git --config .gitleaks.toml --redact --verbose --exit-code 1 .
