<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 304" width="880" height="304" role="img" aria-labelledby="t d">
<title id="t">Which periods a comparison uses</title>
<desc id="d">Postgres, MySQL, SQL Server, and Oracle without AWR keep counters that only grow, so three snapshots give two periods: the reference period from the snapshot before the baseline to the baseline, and the current period from the baseline to this snapshot. The two are compared as rates per second. Oracle's AWR snapshots already cover a period each, so the baseline's AWR period and this snapshot's AWR period are compared directly.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.t{font-size:14px;font-weight:600;fill:#1f2328}.p{font-size:12px;fill:#1f2328}.s{font-size:12px;fill:#59636e}
.a{font-size:12px;font-weight:600;fill:#1a7f37}
.box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}.acc{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
.ln{fill:none;stroke:#59636e;stroke-width:1.5}.acl{fill:none;stroke:#1a7f37;stroke-width:2}.dash{stroke-dasharray:5 4}
.ah{fill:#59636e}.dot{fill:#59636e}.adot{fill:#1a7f37}
@media (prefers-color-scheme:dark){.t,.p{fill:#e6edf3}.s{fill:#9198a1}.a{fill:#3fb950}.box{fill:#151b23;stroke:#3d444d}
.acc{fill:#0f2a1a;stroke:#3fb950}.ln{stroke:#9198a1}.acl{stroke:#3fb950}.ah,.dot{fill:#9198a1}.adot{fill:#3fb950}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>

<text class="t" x="16" y="26">Postgres, MySQL, SQL Server, and Oracle without AWR</text>
<text class="s" x="16" y="44">The counters only grow, so three snapshots give two periods, compared as rates per second.</text>
<path class="ln" marker-end="url(#a)" d="M40,108 H862"/>
<path class="ln" d="M170,84 V90 H460 V84"/>
<text class="p" x="315" y="78" text-anchor="middle">reference period</text>
<path class="acl" d="M460,84 V90 H760 V84"/>
<text class="a" x="610" y="78" text-anchor="middle">current period</text>
<circle class="dot" cx="170" cy="108" r="6"/>
<circle class="dot" cx="460" cy="108" r="6"/>
<circle class="adot" cx="760" cy="108" r="6"/>
<text class="s" x="170" y="132" text-anchor="middle">the snapshot before</text>
<text class="s" x="170" y="147" text-anchor="middle">the baseline</text>
<text class="s" x="460" y="132" text-anchor="middle">the baseline</text>
<text class="s" x="460" y="147" text-anchor="middle">(by default, the previous snapshot)</text>
<text class="a" x="760" y="132" text-anchor="middle">this snapshot</text>

<text class="t" x="16" y="196">Oracle with AWR</text>
<text class="s" x="16" y="214">Each AWR snapshot already covers a period, so the two are compared directly.</text>
<path class="ln" marker-end="url(#a)" d="M40,268 H862"/>
<rect class="box" x="200" y="259" width="180" height="18" rx="4"/>
<rect class="acc" x="580" y="259" width="180" height="18" rx="4"/>
<path class="ln dash" marker-start="url(#a)" marker-end="url(#a)" d="M290,256 C330,226 640,226 670,256"/>
<text class="s" x="480" y="250" text-anchor="middle">compared directly</text>
<text class="s" x="290" y="296" text-anchor="middle">the baseline's AWR period</text>
<text class="a" x="670" y="296" text-anchor="middle">this snapshot's AWR period</text>
</svg>
