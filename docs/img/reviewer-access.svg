<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 304" width="820" height="304" role="img" aria-labelledby="t d">
<title id="t">What the reviewer can see</title>
<desc id="d">The AI model sends tool calls to dbtriage's read-only tools and gets results back. The tools read the stored snapshots; the dbtriage server holds the database credentials and collected those snapshots earlier with a read-only user. No tool and no connection reaches the live database from the model. The model submits a structured review: findings, impact, evidence and a fix.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.t{font-size:14px;font-weight:600;fill:#1f2328}.p{font-size:12px;fill:#1f2328}.s{font-size:12px;fill:#59636e}
.h{font-size:11px;font-weight:600;letter-spacing:.06em;fill:#59636e}.w{font-size:12px;fill:#cf222e}
.box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}.acc{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
.zone{fill:none;stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:6 5}
.ln{fill:none;stroke:#59636e;stroke-width:1.5}.ah{fill:#59636e}
.no{fill:none;stroke:#cf222e;stroke-width:1.5;stroke-dasharray:5 4}.nox{fill:none;stroke:#cf222e;stroke-width:2.5}
@media (prefers-color-scheme:dark){.t,.p{fill:#e6edf3}.s,.h{fill:#9198a1}.w{fill:#f85149}.box{fill:#151b23;stroke:#3d444d}
.acc{fill:#0f2a1a;stroke:#3fb950}.zone{stroke:#3d444d}.ln{stroke:#9198a1}.ah{fill:#9198a1}.no,.nox{stroke:#f85149}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>

<rect class="zone" x="262" y="14" width="540" height="186" rx="12"/>
<text class="h" x="280" y="34">DBTRIAGE SERVER · HOLDS THE DATABASE CREDENTIALS</text>

<rect class="box" x="20" y="64" width="180" height="90" rx="10"/>
<text class="t" x="110" y="96" text-anchor="middle">AI model</text>
<text class="s" x="110" y="116" text-anchor="middle">hosted or local</text>
<text class="s" x="110" y="134" text-anchor="middle">sees tool results only</text>

<path class="ln" marker-end="url(#a)" d="M200,94 H282"/>
<text class="s" x="241" y="86" text-anchor="middle">tool call</text>
<path class="ln" marker-end="url(#a)" d="M284,124 H202"/>
<text class="s" x="241" y="140" text-anchor="middle">results</text>

<rect class="box" x="284" y="48" width="230" height="136" rx="10"/>
<text class="t" x="399" y="72" text-anchor="middle">Read-only tools</text>
<text class="p" x="302" y="96">snapshot sections</text>
<text class="p" x="302" y="114">comparison of two snapshots</text>
<text class="p" x="302" y="132">SQL history</text>
<text class="p" x="302" y="150">engine reports (AWR text)</text>
<text class="p" x="302" y="168">recent deploys</text>

<path class="ln" marker-end="url(#a)" d="M514,116 H598"/>
<text class="s" x="556" y="108" text-anchor="middle">reads</text>
<path class="box" d="M600,66 V150 A90,10 0 0 0 780,150 V66 Z"/><ellipse class="box" cx="690" cy="66" rx="90" ry="10"/>
<text class="t" x="690" y="104" text-anchor="middle">Stored snapshots</text>
<text class="s" x="690" y="122" text-anchor="middle">summary · comparison</text>
<text class="s" x="690" y="138" text-anchor="middle">reports · history</text>

<path class="ln" marker-end="url(#a)" d="M690,227 V164"/>
<text class="s" x="682" y="216" text-anchor="end">collected earlier, read-only</text>
<path class="box" d="M610,238 V284 A80,9 0 0 0 770,284 V238 Z"/><ellipse class="box" cx="690" cy="238" rx="80" ry="9"/>
<text class="t" x="690" y="270" text-anchor="middle">Live database</text>

<path class="no" d="M200,146 H236 V264 H606"/>
<path class="nox" d="M412,256 l16,16 M428,256 l-16,16"/>
<text class="w" x="420" y="248" text-anchor="middle">no tool and no connection reach the live database</text>

<path class="ln" marker-end="url(#a)" d="M110,154 V210"/>
<text class="s" x="120" y="186">submits</text>
<rect class="acc" x="20" y="212" width="180" height="74" rx="10"/>
<text class="t" x="110" y="238" text-anchor="middle">Structured review</text>
<text class="s" x="110" y="257" text-anchor="middle">findings · impact</text>
<text class="s" x="110" y="273" text-anchor="middle">evidence · fix</text>
</svg>
