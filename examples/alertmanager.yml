# Prometheus Alertmanager -> dbtriage serve (incident mode). The alert must carry a `target` label
# matching a [targets.<name>] entry. Grafana unified alerting uses the same webhook contact point.
receivers:
  - name: dbtriage
    webhook_configs:
      - url: http://dbtriage:8080/
        send_resolved: false
        http_config:
          authorization: {type: Bearer, credentials: ${DBTRIAGE_WEBHOOK_TOKEN}}
route:
  routes:
    - matchers: [alertname =~ "DB.*", target != ""]
      receiver: dbtriage
      group_wait: 30s
      repeat_interval: 2h
