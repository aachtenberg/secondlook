[project]
name = "dbtriage"
version = "0.1.0"
description = "Pull database performance snapshots, store them, and let an agent triage what changed."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "anthropic[vertex]>=2.5",
    "oracledb>=3.0",
    "pymysql>=1.1",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.48",
    "pytest>=8",
]
azure = ["azure-storage-blob>=12.20", "azure-identity>=1.17"]  # az:// snapshot storage
mcp = ["mcp>=2.3,<3"]  # dbtriage mcp: the MCP server (off unless [mcp] enabled = true)
sqlserver = [
    "mssql-python>=1.17",
]

[project.scripts]
dbtriage = "dbtriage.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbtriage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
