# gitleaks: the default rules, plus the lab's and the docs' made-up credentials, which are public on purpose.
# A real secret never belongs here: rotate it and take it out of the history instead.
[extend]
useDefault = true

[allowlist]
description = "lab defaults and documentation placeholders"
stopwords = ["dbtriage", "CHANGE_ME", "PASSWORD", "example", "placeholder", "fake", "dummy"]
# The bundle's masking test (tests/test_bundle.py) holds credential-shaped fakes on purpose, and the CI scan walks every
# fetched branch's full history, so a shape that once sat in that file keeps tripping every PR. The file is allowlisted
# by path rather than by value, so no key-shaped literal lives in this config.
paths = ["tests/test_bundle\\.py"]
